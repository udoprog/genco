[package]
name = "genco"
version = "0.20.0"
authors = ["John-John Tedro <udoprog@tedro.se>"]
edition = "2018"
rust-version = "1.88"
description = "A whitespace-aware quasiquoter for beautiful code generation."
documentation = "https://docs.rs/genco"
readme = "README.md"
repository = "https://github.com/udoprog/genco"
license = "MIT OR Apache-2.0"
keywords = ["code-generation", "template"]
categories = ["template-engine"]

[features]
default = ["std", "alloc"]
std = ["alloc", "relative-path/std"]
alloc = []

[dependencies]
genco-macros = { path = "./genco-macros", version = "0.20.0" }

relative-path = { version = "2.0.1", default-features = false, features = ["alloc"] }
smallvec = "1.4.0"

[dev-dependencies]
anyhow = "1.0.31"

[workspace]
members = ["genco-macros"]
